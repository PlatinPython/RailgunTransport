plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.14'
    id 'com.diffplug.spotless' version '6.25.0'
}


version = "${minecraft_version}-${mod_version}"
group = 'platinpython.railgun_transport'
base.archivesName = 'Railgun Transport'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
neoForge {
    version = '21.0.86-beta'

    parchment {
        mappingsVersion = '2024.07.07'
        minecraftVersion = '1.21'
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', 'railgun_transport'
        }

        server {
            server()

            systemProperty 'neoforge.enabledGameTestNamespaces', 'railgun_transport'

            programArgument '--nogui'
        }

        data {
            data()

            programArguments.addAll '--mod', 'railgun_transport', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        'railgun_transport' {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven {
        url 'https://modmaven.dev/'
    }
    maven {
        url = 'https://maven.lukebemish.dev/releases/'
    }
}

dependencies {
    compileOnly 'org.jspecify:jspecify:1.0.0'

    implementation('dev.lukebemish:codecextras:2.3.1') {
        capabilities {
            requireCapability('dev.lukebemish:codecextras-stream')
        }
    }

    // For item interaction testing
    localRuntime 'mekanism:Mekanism:1.21-10.6.5.52'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "railgun_transport",
                "Specification-Vendor"    : "PlatinPython",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "PlatinPython",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: rootProject.file('codeformat/spotless-rules.gradle')
